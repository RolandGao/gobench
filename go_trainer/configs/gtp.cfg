# Opponent: KataGo GTP engine playing with a single visit per move.
# Everything else (move temperature, etc.) is left at KataGo's defaults.
logToStderr = false
logAllGTPCommunication = false
logSearchInfo = false
rules = tromp-taylor
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3
maxVisits = 1
numSearchThreads = 1
ponderingEnabled = false
# Size the neural-net buffers for 9x9 only (much faster than the 19x19 default).
requireMaxBoardSize = true
maxBoardXSizeForNNBuffer = 9
maxBoardYSizeForNNBuffer = 9
