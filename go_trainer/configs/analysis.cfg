# Teacher: KataGo analysis engine. Every position is evaluated with a single
# visit, i.e. one raw neural-network evaluation.
logToStderr = false
logAllRequests = false
logAllResponses = false
logSearchInfo = false
reportAnalysisWinratesAs = BLACK
maxVisits = 1
numAnalysisThreads = 32
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 96
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 14
# Always use the same board orientation so evaluations are repeatable.
nnRandomize = false
# Size the neural-net buffers for 9x9 only (much faster than the 19x19 default).
requireMaxBoardSize = true
maxBoardXSizeForNNBuffer = 9
maxBoardYSizeForNNBuffer = 9
